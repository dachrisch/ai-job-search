server {
  listen 80;
  # The stock nginx:alpine entrypoint injects the ipv6 listen only when
  # default.conf is unmodified. Ours is custom (SPA fallback below), so
  # declare it explicitly - otherwise the busybox-wget HEALTHCHECK, which
  # resolves localhost to ::1 first, gets connection refused (issue #187).
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (issue #187): /history, /login, /search/:id must serve
  # index.html on reload / direct open instead of 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
